name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build and release even if the version tag already exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.read_version.outputs.current_version }}
      version_changed: ${{ steps.compare_versions.outputs.version_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Current Version
        id: read_version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/SVRaidBot.cs | sed 's/.*Version = "\(.*\)";/\1/')
          echo "Current version is $CURRENT_VERSION"
          echo "current_version=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: compare_versions
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.read_version.outputs.current_version }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_BUILD" = "true" ]; then
            echo "Manual force build requested"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --prune --unshallow --tags || git fetch --prune --tags

          if git ls-remote --tags --exit-code origin "$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag $CURRENT_VERSION already exists, skipping release"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $CURRENT_VERSION does not exist, creating release"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: windows-latest
    env:
      Project_Name: SysBot.Pokemon.WinForms/SysBot.Pokemon.WinForms.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: dotnet restore ${{ env.Project_Name }} --runtime win-x64

      - name: Build
        run: dotnet build ${{ env.Project_Name }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.Project_Name }} --configuration Release --output ./publish /p:PublishSingleFile=true /p:SelfContained=false /p:RuntimeIdentifier=win-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SVRaidBot
          path: ./publish

  create-release:
    needs: [version-check, build]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Current Version
        id: read_version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/SVRaidBot.cs | sed 's/.*Version = "\(.*\)";/\1/')
          echo "CURRENT_VERSION=v$CURRENT_VERSION" >> "$GITHUB_ENV"

      - name: Get Recent Changes
        id: recent_changes
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          RECENT_CHANGES=$(git log --pretty=format:"- %s" "$LATEST_TAG"..HEAD)

          if [ -z "$RECENT_CHANGES" ]; then
            RECENT_CHANGES="- Initial release"
          fi

          echo "RECENT_CHANGES<<EOF" >> "$GITHUB_ENV"
          echo "$RECENT_CHANGES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: SVRaidBot
          path: ./publish

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.CURRENT_VERSION }}
          name: Release ${{ env.CURRENT_VERSION }}
          body: |
            ## Recent Changes
            ${{ env.RECENT_CHANGES }}
          files: ./publish/SVRaidBot.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
