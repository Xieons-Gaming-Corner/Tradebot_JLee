name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.read_version.outputs.current_version }}
      version_changed: ${{ steps.compare_versions.outputs.version_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Current Version
        id: read_version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/PokeBot.cs | sed 's/.*Version = "\(.*\)";/\1/')

          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not read a version from SysBot.Pokemon/Helpers/PokeBot.cs"
            echo 'Expected: public const string Version = "1.0.0";'
            exit 1
          fi

          echo "Current version is $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare Versions
        id: compare_versions
        shell: bash
        run: |
          LAST_VERSION="${{ secrets.LAST_KNOWN_VERSION }}"
          CURRENT_VERSION="${{ env.CURRENT_VERSION }}"

          echo "Last known version: $LAST_VERSION"
          echo "Current version: $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$LAST_VERSION" ]; then
            echo "No version change detected."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version change detected."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version-check
    runs-on: windows-latest

    env:
      Project_Name: SysBot.Pokemon.WinForms/SysBot.Pokemon.WinForms.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: dotnet restore ${{ env.Project_Name }} --runtime win-x64

      - name: Build
        run: dotnet build ${{ env.Project_Name }} --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish ${{ env.Project_Name }}
          --configuration Release
          --output ./publish
          /p:PublishSingleFile=true
          /p:SelfContained=false
          /p:RuntimeIdentifier=win-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokeBot
          path: ./publish
          if-no-files-found: error

  create-release:
    needs: [version-check, build]
    if: needs.version-check.outputs.version_changed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Current Version
        id: read_version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep 'public const string Version' SysBot.Pokemon/Helpers/PokeBot.cs | sed 's/.*Version = "\(.*\)";/\1/')

          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not read a version from SysBot.Pokemon/Helpers/PokeBot.cs"
            exit 1
          fi

          echo "Current version is $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

      - name: Get Recent Changes
        id: recent_changes
        shell: bash
        run: |
          LAST_VERSION="${{ secrets.LAST_KNOWN_VERSION }}"

          if [ -z "$LAST_VERSION" ] || ! git rev-parse "$LAST_VERSION" >/dev/null 2>&1; then
            echo "LAST_VERSION is not set or was not found. Using the initial commit."
            LAST_VERSION=$(git rev-list --max-parents=0 HEAD)
          fi

          RECENT_CHANGES=$(git log --pretty=format:"- %s" "$LAST_VERSION"..HEAD)

          if [ -z "$RECENT_CHANGES" ]; then
            RECENT_CHANGES="- Initial release"
          fi

          {
            echo "RECENT_CHANGES<<EOF"
            echo "$RECENT_CHANGES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: PokeBot
          path: ./publish

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.CURRENT_VERSION }}
          release_name: Release ${{ env.CURRENT_VERSION }}
          body: |
            ## Recent Changes
            ${{ env.RECENT_CHANGES }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./publish/PokeBot.exe
          asset_name: PokeBot.exe
          asset_content_type: application/octet-stream
